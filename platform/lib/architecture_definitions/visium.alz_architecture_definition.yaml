name: visium
# Greenfield hierarchy created new under the tenant root (parent_resource_id),
# alongside the untouched mg-02 tree. All groups exist:false => created here.
# IDs are prefixed `visium-` because management-group IDs are TENANT-GLOBAL and
# the old structure already uses `platform` / `landing-zones` / `sandbox`.
# Display names stay clean.
#
# visium
# ├── platform ── management / connectivity / identity
# ├── landing-zones ── corp / online
# ├── sandbox
# └── decommissioned
management_groups:
  - id: visium
    display_name: Visium
    archetypes: [root_custom]
    exists: false
    parent_id: null

  - id: visium-platform
    display_name: Platform
    archetypes: [platform_custom]
    exists: false
    parent_id: visium

  - id: visium-management
    display_name: Management
    archetypes: [management_custom]
    exists: false
    parent_id: visium-platform

  - id: visium-connectivity
    display_name: Connectivity
    archetypes: [connectivity_custom]
    exists: false
    parent_id: visium-platform

  - id: visium-identity
    display_name: Identity
    archetypes: [identity_custom]
    exists: false
    parent_id: visium-platform

  - id: visium-landing-zones
    display_name: Landing Zones
    archetypes: [landing_zones_custom]
    exists: false
    parent_id: visium

  - id: visium-corp
    display_name: Corp
    archetypes: [corp_custom]
    exists: false
    parent_id: visium-landing-zones

  - id: visium-online
    display_name: Online
    archetypes: [online_custom]
    exists: false
    parent_id: visium-landing-zones

  - id: visium-sandbox
    display_name: Sandbox
    archetypes: [sandbox_custom]
    exists: false
    parent_id: visium

  - id: visium-decommissioned
    display_name: Decommissioned
    archetypes: [decommissioned_custom]
    exists: false
    parent_id: visium
